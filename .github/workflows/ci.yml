name: CI

# Build gate: a non-compiling main is what froze production for 4 merges
# (PRs #47/#48/#51/#27 all failed to deploy on a broken src/App.tsx).
# This runs the same `tsc --noEmit && vite build` Vercel uses, plus unit tests,
# so a broken build can't be merged. Mark the `build` check as REQUIRED in
# Settings -> Branches -> main branch protection for it to actually block merges.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Don't pile up runs on the same branch; cancel superseded ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the Bundle resync guard can diff against the PR base.
          fetch-depth: 0

      - name: Install pnpm
        # No `version:` input on purpose — pnpm/action-setup@v4 reads the
        # packageManager field in package.json, and errors if both are set and
        # disagree. One source of truth for the pnpm version.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gate that matters: tsc --noEmit && vite build (same as `npm run build`).
      # This is exactly what would have caught the malformed App.tsx.
      - name: Type-check + build
        run: pnpm run build
        env:
          # Placeholders so a missing-env edge case can't fail the build.
          # Vite inlines VITE_* at build time; these are not real credentials.
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Unit tests
        run: pnpm run test:unit

      # The committed web bundle (dist/, native-web/, ios public) embeds the iOS
      # app's web layer. If source changes ship without a resync, the iOS archive
      # ships stale code (Guideline 2.1). Fail a PR that touches build-affecting
      # source without resyncing the bundle. Excludes test files (no bundle impact).
      - name: Bundle resync guard
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base" HEAD)
          # Vite never compiles these into the SPA. Deleting them must not force
          # an ios public resync — a placeholder-env rebuild bricks the shipped
          # bundle (see the sanity check below).
          # - src/app/api/** App Router leftovers (Vercel serves api/, not these)
          # - src/**/*.md notes
          # - unused Next layout (ChatProvider + GNL live in App.tsx)
          # - confirmed-zero-importer modules removed in the same cleanup
          not_client_graph='\.test\.(ts|tsx)$|\.md$|^src/app/api/|^src/app/hi-its-me/layout\.tsx$|^src/lib/buddySuggestions\.ts$|^src/lib/roomSchema\.ts$'
          src_changed=$(echo "$changed" | grep -E '^(src/|public/|index\.html$)' | grep -vE "$not_client_graph" || true)
          bundle_changed=$(echo "$changed" | grep -E '^(dist/|native-web/|ios/App/App/public/)' || true)
          if [ -n "$src_changed" ] && [ -z "$bundle_changed" ]; then
            echo "::error::Build-affecting source changed but the web bundle was not resynced. Run 'npm run build && npm run ios:sync' and commit dist/ + native-web/ + ios/App/App/public."
            echo "Changed source:"; echo "$src_changed"
            exit 1
          fi

      - name: Bundle integrity guard (hashed assets are immutable)
        if: github.event_name == 'pull_request'
        run: |
          # Every file under dist/assets/ and ios/App/App/public/assets/ carries a
          # Vite content hash in its name, so a given path must always hold the
          # same bytes. A real build only ever ADDS and DELETES those files; a
          # MODIFIED one means build output was patched by hand instead of
          # rebuilt. That keeps the old URL on new content, and every cache keyed
          # on the URL (browser, CDN, WKWebView) has no way to notice.
          #
          # This happened on #167: index-B1A6eQzL.css was edited in place to add
          # the contrast + reduced-motion rules after a rebuild had baked the
          # placeholder Supabase env into the JS. The hand-patch also missed two
          # rules the real build emits. The answer to "the rebuild bricked the
          # backend" is to rebuild WITH VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY
          # set, never to edit the artifact.
          #
          # Why a real build never trips this: Rollup derives each chunk name from
          # its own content plus the content of every chunk it references, and
          # __HIM_BUILD_STAMP__ (vite.config.ts) changes every build inside the
          # entry chunk's closure, so every build renames every chunk. The one
          # thing Vite writes after hashing, the preload dependency arrays that
          # carry the CSS file name, lands only in chunks that import the entry.
          # No resync commit in this repo's history has ever modified a hashed
          # asset in place. If the build stamp is ever removed, revisit this.
          base="${{ github.event.pull_request.base.sha }}"
          modified=$(git diff --name-only --diff-filter=M "$base" HEAD -- dist/assets ios/App/App/public/assets)
          if [ -n "$modified" ]; then
            echo "::error::Content-hashed bundle files were edited in place (same name, different bytes). Regenerate with 'npm run build && npm run ios:sync' (with VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY set) and commit dist/ + ios/App/App/public."
            echo "$modified" | sed 's/^/    /'
            exit 1
          fi
          echo "No content-hashed bundle file was modified in place."

      - name: One lockfile only
        run: |
          # This repo installs with pnpm everywhere: both workflows, and Vercel
          # (which auto-detects pnpm-lock.yaml since vercel.json sets no
          # installCommand). A second lockfile does not just sit there — it
          # resolves the same semver ranges to DIFFERENT versions, and whichever
          # file you read decides what you believe is installed.
          #
          # That is not hypothetical. On 29 Aug 2026 the two disagreed about
          # Capacitor (npm 8.3.0 vs pnpm 8.3.1), which sent `cap sync` rewriting
          # CapApp-SPM/Package.swift back and forth (#129, #130), and about
          # eslint-plugin-react-hooks (7.0.1 vs 7.1.1), which made `npm run lint`
          # report 0 problems locally and 31 under CI's install.
          #
          # `npm install` recreates package-lock.json silently, so this guard is
          # what keeps the second file from coming back.
          extra=$(ls package-lock.json yarn.lock bun.lockb 2>/dev/null || true)
          if [ -n "$extra" ]; then
            echo "::error::Found a lockfile other than pnpm-lock.yaml: $extra"
            echo "::error::This project installs with pnpm (see the packageManager field in package.json)."
            echo "::error::Delete the extra lockfile and run 'pnpm install' instead of npm/yarn."
            exit 1
          fi
          echo "pnpm-lock.yaml is the only lockfile."

      - name: Shipped bundle sanity (no placeholder backend)
        run: |
          # The iOS app ships the checked-in ios/App/App/public bundle verbatim
          # (see ci_scripts/ci_post_clone.sh). A bundle built without VITE_SUPABASE_*
          # env bakes placeholder.supabase.co and bricks every native build at boot
          # (this shipped in #88 as builds 293-304). Fail fast if it ever reappears.
          if grep -rq 'placeholder\.supabase\.co\|placeholder-anon-key' ios/App/App/public/assets/; then
            echo "::error::ios/App/App/public was built WITHOUT Supabase env vars — placeholder backend baked in. Rebuild with VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY set, then 'npm run ios:sync' and commit."
            exit 1
          fi

      - name: Shipped bundle sanity (single entry point)
        run: |
          # A merge that hits conflicts in tracked build output can be "resolved"
          # by keeping both sides, producing an index.html with two module entry
          # scripts and two complete chunk graphs. The app then boots twice.
          #
          # Neither guard above catches it: the resync guard only asks whether the
          # bundle changed alongside source (it did), and the placeholder guard
          # only inspects backend URLs (correct in both graphs). This shipped to
          # main in #104 and was rebuilt in #119.
          #
          # Content-hashed chunks cannot be conflict-resolved by hand. If this
          # fires, delete the trees and regenerate:
          #   npm run build && npm run ios:sync
          fail=0
          for f in dist/index.html native-web/index.html ios/App/App/public/index.html; do
            [ -f "$f" ] || continue
            n=$(grep -oE '<script[^>]*type="module"[^>]*src="[^"]*"' "$f" | wc -l | tr -d ' ')
            if [ "$n" != "1" ]; then
              echo "::error::$f has $n module entry scripts, expected exactly 1. Regenerate with 'npm run build && npm run ios:sync' — do not hand-resolve conflicts in build output."
              grep -oE '<script[^>]*type="module"[^>]*src="[^"]*"' "$f" | sed 's/^/    /'
              fail=1
            fi
          done
          exit $fail

# Note: `lint` (eslint .) is intentionally NOT gated here — the repo currently
# has ~3.5k pre-existing eslint errors, so blocking on it would reject every PR.
# Clean those up incrementally, then add a `pnpm run lint` step to this job.
